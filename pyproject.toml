[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "local-gpt2-xl"
version = "0.1.0"
description = "A small, CPU-first local runner for OpenAI's original 1.5B-parameter GPT-2 checkpoint."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Michael P. Frank" }]
dependencies = [
  "accelerate>=1.0,<2",
  "huggingface-hub>=0.27,<2",
  "safetensors>=0.4,<1",
  "transformers>=5.18,<6",
]

[project.scripts]
gpt2-xl = "gpt2_local.cli:main"
gpt2-experiment = "gpt2_local.experiment:main"
gpt2-chat = "gpt2_local.chat:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gpt2_local = ["web/*.html"]
